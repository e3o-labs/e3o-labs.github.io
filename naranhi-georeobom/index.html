<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>나란히 걸어봄</title>
  <style>
    :root { color: #20352c; background: #f5f1e9; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(720px, calc(100% - 32px)); margin: 64px auto; padding: 36px; background: #fcfaf5; border: 1px solid #d9d6cb; border-radius: 24px; }
    .eyebrow { color: #72806b; font-size: .8rem; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 8px 0 14px; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1.1; }
    p { color: #526053; line-height: 1.75; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    a { display: inline-block; padding: 12px 16px; border-radius: 12px; background: #284536; color: #fff; text-decoration: none; font-weight: 750; }
    a.secondary { background: #e2e9d6; color: #294334; }
    .note { margin-top: 32px; padding-top: 22px; border-top: 1px solid #d9d6cb; font-size: .92rem; color: #6f7a70; }
    @media (max-width: 560px) { main { margin: 0; width: 100%; min-height: 100vh; border: 0; border-radius: 0; padding: 36px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">7-DAY DOG ADOPTION READINESS PRACTICE</div>
    <h1>나란히 걸어봄</h1>
    <p>강아지를 입양하기 전에 7일 동안 돌봄과 회고를 연습하며 내 생활에서 준비된 점과 더 확인할 점을 살펴보는 입양 준비 시뮬레이션입니다.</p>
    <p>실제 반려견의 성격·건강 상태를 진단하거나 입양 적합성을 판정하는 서비스가 아닙니다.</p>
    <div class="links">
      <a href="./support/">고객지원</a>
      <a class="secondary" href="./privacy/">개인정보 처리방침</a>
    </div>
    <p class="note">운영: 이응랩스(개인 개발자)</p>
  </main>
</body>
</html>
