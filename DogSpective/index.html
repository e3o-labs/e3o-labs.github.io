<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="댕스펙티브 개인정보 처리방침과 고객지원 안내">
  <title>댕스펙티브 안내</title>
  <style>
    :root { color: #172033; background: #f5f7fb; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.7; }
    main { width: min(720px, calc(100% - 32px)); margin: 32px auto; padding: 32px; background: #fff; border: 1px solid #e6eaf0; border-radius: 20px; box-shadow: 0 8px 28px rgba(25, 42, 70, .06); }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    p { color: #3e4a5e; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
    a { display: block; padding: 18px; border: 1px solid #dbe5f5; border-radius: 14px; color: #155ad8; background: #f7faff; text-decoration: none; font-weight: 700; }
    a:hover { background: #eef4ff; }
    small { display: block; margin-top: 4px; color: #68758a; font-weight: 400; }
    @media (max-width: 560px) { main { margin: 0; width: 100%; min-height: 100vh; padding: 24px 20px 40px; border: 0; border-radius: 0; box-shadow: none; } nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>댕스펙티브</h1>
    <p>반려견 행동을 기록하고 다양한 상황의 대처 방법을 연습하는 DogSpective의 공식 안내 페이지입니다.</p>
    <nav aria-label="댕스펙티브 안내">
      <a href="privacy/">개인정보 처리방침<small>데이터 처리와 이용자 권리를 확인합니다.</small></a>
      <a href="support/">고객지원<small>이용 방법과 문의 채널을 확인합니다.</small></a>
    </nav>
  </main>
</body>
</html>
